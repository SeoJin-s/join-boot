	<script type="text/javascript">
	// 윤년 203p
		let isLeapYear = function(year) {
		// year 가 입력되지않으면 undefined
			return (year%4==0) && (year%100!=0) || (year%4==0);
		} // 입력값이 숫자 하나이고, 매개값은 bool
		
	console.log('2020년', isLeapYear(2020));
	console.log('2010년', isLeapYear(2010));
	console.log('년', isLeapYear());
	
	// 204p
	let sumAll = function(a, b) {
		let output = 0;
		for(let i=a; i<=b; i++) {
			output += i;
		}
		return output;
	}	// 숫자 2개를 입력받고 숫자 하나를 반환
	console.log('7~50의합:', sumAll(7,50));
	
	// 205p		// of 자바의 포이치문
	let min = function(array) {
		let output = array[0];
		for(let item of array) {
			if(output > item) {
				output = item;
			}
		}
		return output; // 최솟값
	}
		console.log(min([3, 5, 1, 7, 9]));
		console.log(min(['b', 'a', 'c']));
		
	// 가변인수
	let sample = function(...args) {
		for(let a of args){
		console.log(a);
		}
	}
	sample(3, 4, 'a', 7);
	
	sample([2,3,4,5]);
	
	sample(...a); // 전개 연산자
	
	let earning = function(name, wage=8590, hours=40) {
		console.log(name);
		console.log(wage);
		console.log(hours);
	}
	earning('루피', 10000, 24);
	earning();
	earning('나미');
	earning('상디', 5000);
	</script>

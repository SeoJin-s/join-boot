<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>CASIO 스타일 계산기</title>
  <link href="https://fonts.cdnfonts.com/css/dseg7-classic" rel="stylesheet">
  <style>
    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .calculator {
      background: linear-gradient(to bottom, #c0c0c0, #999);
      border: 4px solid #333;
      border-radius: 20px;
      padding: 20px;
      box-shadow: inset -3px -3px 6px #666, 4px 4px 10px rgba(0,0,0,0.6);
    }

    table {
      border-spacing: 6px;
    }

    #result {
      width: 100%;
      height: 60px;
      font-size: 32px;
      font-family: 'DSEG7 Classic', monospace;
      background: linear-gradient(145deg, #d4fcd4, #c0f0c0);
      border: 2px inset #444;
      color: #000;
      text-shadow: 1px 1px 0 #ccc;
      padding: 10px;
      text-align: right;
      border: 3px inset #666;
      box-shadow: inset -2px -2px 4px #aaa, inset 2px 2px 4px #fff;
      border-radius: 5px;
    }

    button {
      /*background: linear-gradient(#f0f0f0, #c0c0c0);*/
      border: 2px solid #777;
 	  box-shadow: 2px 2px 3px #444;
      width: 60px;
      height: 60px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 10px;
      border: 2px solid #444;
      cursor: pointer;
      box-shadow: 1px 1px 2px #333;
      font-family: sans-serif;
      transition: all 0.5s ease;
    }
	button:active {
	  transform: scale(0.95);
	  box-shadow: inset 2px 2px 4px #222;
	}
	
    /* 숫자 */
    #zero, #one, #two, #three, #four, #five, #six, #seven, #eight, #nine {
      background-color: #e0e0e0;
      color: #000;
    }

    /* 연산자 */
    #plus, #minus, #multiple, #divide {
       background-color: #2b2b2b;
  		color: #fff;
    }

    /* 기능 */
    #equal {
      background-color: #1a73e8;
      color: white;
    }

    #back {
      background-color: #a83232;
      color: white;
    }

    .btn-red {
      background-color: #c62828;
      color: white;
    }

    .btn-blue {
      background-color: #1565c0;
      color: white;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <table>
      <tr>
        <td colspan="4"><input type="text" id="result" readonly></td>
      </tr>
      <tr>  
        <td><button type="button" id="seven">7</button></td>
        <td><button type="button" id="eight">8</button></td>
        <td><button type="button" id="nine">9</button></td>
        <td><button type="button" id="divide">/</button></td>
      </tr>
      <tr>
        <td><button type="button" id="four">4</button></td>
        <td><button type="button" id="five">5</button></td>
        <td><button type="button" id="six">6</button></td>
        <td><button type="button" id="multiple">*</button></td>
      </tr>
      <tr>
        <td><button type="button" id="one">1</button></td>
        <td><button type="button" id="two">2</button></td>
        <td><button type="button" id="three">3</button></td>
        <td><button type="button" id="minus">-</button></td>
      </tr>
      <tr>
        <td><button type="button" id="zero">0</button></td>
        <td><button type="button" id="equal">=</button></td>
        <td><button type="button" id="back">⌫</button></td>
        <td><button type="button" id="plus">+</button></td>
      </tr>
    </table>
  </div>
	<script>
			/*
			let zeroClick = function(){
				alert('zeroClick');
			}
			*/
		let result = '';
		document.querySelector('#zero').addEventListener('click',function() {
				// alert('test');
			result = result + 0;
			document.querySelector('#result').value = result;
		});
		
		
		document.querySelector('#one').addEventListener('click',function() {
				// alert('test');
			result = result + 1;
			document.querySelector('#result').value = result;
		});
		

		document.querySelector('#plus').addEventListener('click', function() {
		    const lastChar = result.charAt(result.length - 1);
		    if (['+', '-', '*', '/'].includes(lastChar)) {
		        return; // 연산자 연속 입력 막기!
		    }
		    result += '+';
		    document.querySelector('#result').value = result;
		});
		
		document.querySelector('#back').addEventListener('click',function() {
			// alert('test');
		result = result.slice(0, -1);
		document.querySelector('#result').value = result;
	});
		document.querySelector('#two').addEventListener('click',function() {
			// alert('test');
		result = result + 2;
		document.querySelector('#result').value = result;
	});
		document.querySelector('#three').addEventListener('click',function() {
			// alert('test');
		result = result + 3;
		document.querySelector('#result').value = result;
	});
		document.querySelector('#four').addEventListener('click',function() {
			// alert('test');
		result = result + 4;
		document.querySelector('#result').value = result;
	});
		document.querySelector('#five').addEventListener('click',function() {
			// alert('test');
		result = result + 5;
		document.querySelector('#result').value = result;
	});
		document.querySelector('#six').addEventListener('click',function() {
			// alert('test');
		result = result + 6;
		document.querySelector('#result').value = result;
	});
		document.querySelector('#seven').addEventListener('click',function() {
			// alert('test');
		result = result + 7;
		document.querySelector('#result').value = result;
	});
		document.querySelector('#eight').addEventListener('click',function() {
			// alert('test');
		result = result + 8;
		document.querySelector('#result').value = result;
	});
		document.querySelector('#nine').addEventListener('click',function() {
			// alert('test');
		result = result + 9;
		document.querySelector('#result').value = result;
	});
		document.querySelector('#minus').addEventListener('click', function() {
		    const lastChar = result.charAt(result.length - 1);
		    if (['+', '-', '*', '/'].includes(lastChar)) return; // 연속 연산자 방지

		    result += '-';
		    document.querySelector('#result').value = result;
		});
		document.querySelector('#divide').addEventListener('click', function() {
		    const lastChar = result.charAt(result.length - 1);
		    if (['+', '-', '*', '/'].includes(lastChar)) return; // 연속 연산자 방지

		    result += '/';
		    document.querySelector('#result').value = result;
		});
		document.querySelector('#multiple').addEventListener('click', function() {
		    const lastChar = result.charAt(result.length - 1);
		    if (['+', '-', '*', '/'].includes(lastChar)) return; // 연산자 연속 방지

		    result += '*';
		    document.querySelector('#result').value = result;
		});
		
	</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<script type="text/javascript">
		let arr = [];
		arr.push('루피');
		arr.push('나미');
		arr.push('조로');
		
		
		console.log(arr[2]); // 나미
		console.log(arr[3]); // undefiend
		
		arr.push('쵸파');
		arr.push('로빈');
		arr.push('우솝');
		console.log(arr);
		
		let arr2 = arr.splice(3,2);
		console.log(arr);
		console.log(arr2);
		
		console.log(arr.indexOf('조로'));
		
		let str = "동해물과 백두산이 마르고 닳도록";
		console.log(str[3]);
		console.log(str.indexOf('백두산'));
		
	// 자바스크립트의 배열은 자바의 배열보다는 List<Object> 에 가깝다.	
	// 함수형 프로그램
		console.log(arr);
		arr.filter(function(x) { console.log(x);}); // 람다함수를 arr을 순환하면서 요소를 매개값으로 실행한다.
		arr.filter((x) => console.log(x));
		
		</script>
</body>
</html>
